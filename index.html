<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário de Escala</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>📅 Calendário de Escala</h1>
  </header>

  <div class="toggle-config">
    <button id="toggleConfigBtn">⚙️ Configurar Escala</button>
  </div>

  <div class="config-panel" id="configPanel">
    <h2>⚙️ Configuração da Escala</h2>

    <div class="config-row">
      <div class="config-field">
        <label>Data de Início do Ciclo</label>
        <input type="date" id="startDate">
      </div>
      <div class="config-field">
        <label>Primeiro dia da semana</label>
        <select id="firstDayOfWeek">
          <option value="0">Domingo</option>
          <option value="1">Segunda-feira</option>
          <option value="2">Terça-feira</option>
          <option value="3">Quarta-feira</option>
          <option value="4">Quinta-feira</option>
          <option value="5">Sexta-feira</option>
          <option value="6">Sábado</option>
        </select>
      </div>
    </div>

    <div class="pattern-builder">
      <label style="font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;">
        Padrão da Escala (clique para montar)
      </label>
      <div class="pattern-list" id="patternList"></div>
      <div class="pattern-actions">
        <button class="btn-work" data-add="work">+ Dia de Trabalho</button>
        <button class="btn-off" data-add="off">+ Dia de Folga</button>
        <button class="btn-clear" id="clearPatternBtn">Limpar</button>
      </div>
      <div class="pattern-hint">
        Exemplo: Para escala 12×36, adicione 1 dia de trabalho e 1 de folga.<br>
        Para 5×2, adicione 5 dias de trabalho e 2 de folga.
      </div>
    </div>

    <button class="btn-apply" id="applyConfigBtn">Aplicar e Gerar Calendário</button>

    <div class="config-section-title">Cores</div>

    <div class="color-row">
      <div class="color-field">
        <label>Trabalho</label>
        <input type="color" id="colorWork" value="#e94560">
      </div>
      <div class="color-field">
        <label>Folga</label>
        <input type="color" id="colorOff" value="#0f3460">
      </div>
      <div class="color-field">
        <label>Hoje</label>
        <input type="color" id="colorToday" value="#53d769">
      </div>
      <div class="color-field">
        <label>Feriado</label>
        <input type="color" id="colorHoliday" value="#ff9800">
      </div>
    </div>

    <div class="config-section-title">Paletas sugeridas</div>
    <div class="color-presets" id="colorPresets"></div>
  </div>

  <div class="year-nav">
    <button id="prevYearBtn" aria-label="Ano anterior">‹</button>
    <span id="yearLabel"></span>
    <button id="nextYearBtn" aria-label="Próximo ano">›</button>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot work"></div>
      <span>Trabalho</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot off"></div>
      <span>Folga</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot today"></div>
      <span>Hoje</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot holiday"></div>
      <span>Feriado</span>
    </div>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>

  <!-- Day Detail Modal -->
  <div class="modal-overlay" id="dayModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalDateLabel">
      <button class="modal-close" id="modalCloseBtn" aria-label="Fechar">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
