<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário de Escala</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #e94560;
      --accent-glow: rgba(233, 69, 96, 0.15);
      --text: #f0f0f5;
      --text-muted: #8a8a9a;
      --work-bg: #e94560;
      --off-bg: #0f3460;
      --today-border: #53d769;
      --holiday-bg: #ff9800;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 32px 16px 12px;
      background: linear-gradient(180deg, var(--surface) 0%, transparent 100%);
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), #ff6b81);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Config Panel ── */
    .config-panel {
      max-width: 640px;
      margin: 16px auto;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .config-panel h2 {
      font-size: 1.05rem;
      margin-bottom: 16px;
      color: var(--accent);
      font-weight: 700;
    }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }

    .config-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 120px;
    }

    .config-field label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .config-field input, .config-field select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .config-field input:focus, .config-field select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Pattern builder */
    .pattern-builder {
      margin-top: 12px;
    }

    .pattern-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      min-height: 40px;
      padding: 10px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .pattern-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: default;
    }

    .pattern-chip.work {
      background: var(--work-bg);
      color: #fff;
    }

    .pattern-chip.off {
      background: #2d4a22;
      color: #a5d6a7;
    }

    .pattern-chip .remove-chip {
      cursor: pointer;
      margin-left: 2px;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .pattern-chip .remove-chip:hover {
      opacity: 1;
    }

    .pattern-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover { opacity: 0.85; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-work {
      background: var(--work-bg);
      color: #fff;
    }

    .btn-off {
      background: #2d4a22;
      color: #a5d6a7;
    }

    .btn-clear {
      background: var(--surface2);
      color: var(--text-muted);
    }

    .btn-apply {
      background: linear-gradient(135deg, var(--accent), #ff6b81);
      color: #fff;
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(233, 69, 96, 0.3);
    }

    .pattern-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ── Color section ── */
    .config-section-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      margin-top: 20px;
      margin-bottom: 10px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .color-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 8px;
    }

    .color-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-field label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .color-field input[type="color"] {
      width: 36px;
      height: 30px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      background: var(--bg);
      cursor: pointer;
      padding: 2px;
    }

    /* ── Color Presets ── */
    .color-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .color-preset-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .color-preset-btn:hover {
      border-color: var(--accent);
      background: var(--surface2);
    }

    .color-preset-btn.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .preset-dots {
      display: flex;
      gap: 3px;
    }

    .preset-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: block;
    }

    /* ── Year navigation ── */
    .year-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 24px 0 16px;
    }

    .year-nav button {
      background: var(--surface);
      color: var(--text);
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow);
    }

    .year-nav span {
      font-size: 1.5rem;
      font-weight: 800;
      min-width: 70px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      font-size: 0.8rem;
      padding: 12px 16px;
      background: var(--surface);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }

    .legend-dot.work { background: var(--work-bg); }
    .legend-dot.off { background: var(--off-bg); }
    .legend-dot.today { border: 2px solid var(--today-border); background: var(--off-bg); }
    .legend-dot.holiday { background: var(--holiday-bg); }

    /* ── Holiday ── */
    .day-cell.holiday-day {
      outline: 2px solid var(--holiday-bg);
      outline-offset: -1px;
    }

    .day-cell.holiday-day.today {
      outline: 2px solid var(--today-border);
      box-shadow: inset 0 0 0 2px var(--holiday-bg);
    }

    .holiday-dot {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--holiday-bg);
    }

    .holiday-label {
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.38rem;
      color: var(--holiday-bg);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1;
      pointer-events: none;
    }

    /* ── Calendar Grid ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    .month-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .month-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .month-title {
      text-align: center;
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .weekday-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      border-radius: 6px;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .day-cell:not(.empty):hover {
      transform: scale(1.15);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      z-index: 2;
    }

    .day-cell.empty { visibility: hidden; cursor: default; }

    .day-cell.work-day {
      background: var(--work-bg);
      color: #fff;
      font-weight: 600;
    }

    .day-cell.off-day {
      background: var(--off-bg);
      color: var(--text-muted);
    }

    .day-cell.today {
      outline: 2.5px solid var(--today-border);
      outline-offset: -1px;
      box-shadow: 0 0 8px rgba(83, 215, 105, 0.3);
    }

    /* ── Toggle config ── */
    .toggle-config {
      text-align: center;
      margin-bottom: 8px;
    }

    .toggle-config button {
      background: var(--surface);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      box-shadow: 0 2px 12px rgba(233, 69, 96, 0.15);
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 32px;
      min-width: 300px;
      max-width: 400px;
      box-shadow: 0 16px 64px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.25s;
      position: relative;
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
      transform: none;
    }

    .modal-date {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--text);
    }

    .modal-weekday {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-transform: capitalize;
    }

    .modal-info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--bg);
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    .modal-info-row .info-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .modal-info-row.work-info {
      border-left: 3px solid var(--work-bg);
    }

    .modal-info-row.off-info {
      border-left: 3px solid var(--off-bg);
    }

    .modal-info-row.holiday-info {
      border-left: 3px solid var(--holiday-bg);
    }

    .modal-info-row.today-info {
      border-left: 3px solid var(--today-border);
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .calendar-grid {
        grid-template-columns: 1fr;
      }
      header h1 { font-size: 1.3rem; }
      .modal {
        min-width: auto;
        margin: 0 16px;
        max-width: calc(100vw - 32px);
      }
      .legend {
        margin-left: 16px;
        margin-right: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>📅 Calendário de Escala</h1>
  </header>

  <div class="toggle-config">
    <button onclick="toggleConfig()">⚙️ Configurar Escala</button>
  </div>

  <div class="config-panel" id="configPanel">
    <h2>⚙️ Configuração da Escala</h2>

    <div class="config-row">
      <div class="config-field">
        <label>Data de Início do Ciclo</label>
        <input type="date" id="startDate">
      </div>
      <div class="config-field">
        <label>Primeiro dia da semana</label>
        <select id="firstDayOfWeek" onchange="updateFirstDay()">
          <option value="0">Domingo</option>
          <option value="1">Segunda-feira</option>
          <option value="2">Terça-feira</option>
          <option value="3">Quarta-feira</option>
          <option value="4">Quinta-feira</option>
          <option value="5">Sexta-feira</option>
          <option value="6">Sábado</option>
        </select>
      </div>
    </div>

    <div class="pattern-builder">
      <label style="font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;">
        Padrão da Escala (clique para montar)
      </label>
      <div class="pattern-list" id="patternList"></div>
      <div class="pattern-actions">
        <button class="btn-work" onclick="addPatternDay('work')">+ Dia de Trabalho</button>
        <button class="btn-off" onclick="addPatternDay('off')">+ Dia de Folga</button>
        <button class="btn-clear" onclick="clearPattern()">Limpar</button>
      </div>
      <div class="pattern-hint">
        Exemplo: Para escala 12×36, adicione 1 dia de trabalho e 1 de folga.<br>
        Para 5×2, adicione 5 dias de trabalho e 2 de folga.
      </div>
    </div>

    <button class="btn-apply" onclick="applyConfig()">Aplicar e Gerar Calendário</button>

    <div class="config-section-title">Cores</div>

    <div class="color-row">
      <div class="color-field">
        <label>Trabalho</label>
        <input type="color" id="colorWork" value="#e94560" onchange="updateColors()">
      </div>
      <div class="color-field">
        <label>Folga</label>
        <input type="color" id="colorOff" value="#0f3460" onchange="updateColors()">
      </div>
      <div class="color-field">
        <label>Hoje</label>
        <input type="color" id="colorToday" value="#53d769" onchange="updateColors()">
      </div>
      <div class="color-field">
        <label>Feriado</label>
        <input type="color" id="colorHoliday" value="#ff9800" onchange="updateColors()">
      </div>
    </div>

    <div class="config-section-title">Paletas sugeridas</div>
    <div class="color-presets" id="colorPresets"></div>
  </div>

  <div class="year-nav">
    <button onclick="changeYear(-1)">‹</button>
    <span id="yearLabel"></span>
    <button onclick="changeYear(1)">›</button>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot work"></div>
      <span>Trabalho</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot off"></div>
      <span>Folga</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot today"></div>
      <span>Hoje</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot holiday"></div>
      <span>Feriado</span>
    </div>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>

  <!-- Day Detail Modal -->
  <div class="modal-overlay" id="dayModal" onclick="closeDayModal(event)">
    <div class="modal">
      <button class="modal-close" onclick="closeDayModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const MONTH_NAMES = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];
    const WEEKDAY_SHORT = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const WEEKDAY_LONG = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

    let currentYear = new Date().getFullYear();
    let pattern = []; // array of 'work' | 'off'
    let cycleStartDate = null;
    let firstDayOfWeek = 0; // 0=Sunday, 1=Monday, etc.

    // ── Color Presets ──
    const COLOR_PRESETS = [
      { name: 'Padrão', work: '#e94560', off: '#0f3460', today: '#53d769', holiday: '#ff9800' },
      { name: 'Oceano', work: '#0077b6', off: '#023e8a', today: '#00f5d4', holiday: '#f77f00' },
      { name: 'Floresta', work: '#2d6a4f', off: '#1b4332', today: '#95d5b2', holiday: '#e76f51' },
      { name: 'Lavanda', work: '#7b2cbf', off: '#3c096c', today: '#c77dff', holiday: '#ffbe0b' },
      { name: 'Pôr do Sol', work: '#e63946', off: '#1d3557', today: '#a8dadc', holiday: '#f1fa8c' },
      { name: 'Monocromático', work: '#495057', off: '#212529', today: '#adb5bd', holiday: '#ffc300' },
      { name: 'Neon', work: '#ff006e', off: '#240046', today: '#3a86ff', holiday: '#ffbe0b' },
      { name: 'Terra', work: '#bc6c25', off: '#283618', today: '#606c38', holiday: '#dda15e' },
    ];

    function renderColorPresets() {
      const container = document.getElementById('colorPresets');
      container.innerHTML = COLOR_PRESETS.map((preset, i) => {
        return `<button class="color-preset-btn" onclick="applyColorPreset(${i})">
          <div class="preset-dots">
            <span style="background:${preset.work}"></span>
            <span style="background:${preset.off}"></span>
            <span style="background:${preset.today}"></span>
            <span style="background:${preset.holiday}"></span>
          </div>
          ${preset.name}
        </button>`;
      }).join('');
    }

    function applyColorPreset(index) {
      const preset = COLOR_PRESETS[index];
      const root = document.documentElement;

      document.getElementById('colorWork').value = preset.work;
      document.getElementById('colorOff').value = preset.off;
      document.getElementById('colorToday').value = preset.today;
      document.getElementById('colorHoliday').value = preset.holiday;

      root.style.setProperty('--work-bg', preset.work);
      root.style.setProperty('--off-bg', preset.off);
      root.style.setProperty('--today-border', preset.today);
      root.style.setProperty('--holiday-bg', preset.holiday);

      // Highlight active preset
      document.querySelectorAll('.color-preset-btn').forEach((btn, j) => {
        btn.classList.toggle('active', j === index);
      });

      saveConfig();
      renderCalendar();
    }

    // ── First day of week ──
    function updateFirstDay() {
      firstDayOfWeek = parseInt(document.getElementById('firstDayOfWeek').value, 10);
      saveConfig();
      renderCalendar();
    }

    function getOrderedWeekdays() {
      const ordered = [];
      for (let i = 0; i < 7; i++) {
        ordered.push(WEEKDAY_SHORT[(firstDayOfWeek + i) % 7]);
      }
      return ordered;
    }

    // ── Color management ──
    function updateColors() {
      const root = document.documentElement;
      root.style.setProperty('--work-bg', document.getElementById('colorWork').value);
      root.style.setProperty('--off-bg', document.getElementById('colorOff').value);
      root.style.setProperty('--today-border', document.getElementById('colorToday').value);
      root.style.setProperty('--holiday-bg', document.getElementById('colorHoliday').value);

      // Remove active preset highlight
      document.querySelectorAll('.color-preset-btn').forEach(btn => btn.classList.remove('active'));

      saveConfig();
      renderCalendar();
    }

    // ── Brazilian Holidays ──
    function getEasterDate(year) {
      // Meeus/Jones/Butcher algorithm
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

    function getBrazilianHolidays(year) {
      const holidays = {};

      function addHoliday(date, name) {
        const key = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
        if (holidays[key]) {
          holidays[key] += ' / ' + name;
        } else {
          holidays[key] = name;
        }
      }

      // Fixed holidays
      addHoliday(new Date(year, 0, 1), 'Confraternização Universal');
      addHoliday(new Date(year, 3, 21), 'Tiradentes');
      addHoliday(new Date(year, 4, 1), 'Dia do Trabalho');
      addHoliday(new Date(year, 8, 7), 'Independência do Brasil');
      addHoliday(new Date(year, 9, 12), 'Nossa Sra. Aparecida');
      addHoliday(new Date(year, 10, 2), 'Finados');
      addHoliday(new Date(year, 10, 15), 'Proclamação da República');
      addHoliday(new Date(year, 10, 20), 'Dia da Consciência Negra');
      addHoliday(new Date(year, 11, 25), 'Natal');

      // Moveable holidays based on Easter
      const easter = getEasterDate(year);
      const msPerDay = 86400000;

      const carnival1 = new Date(easter.getTime() - 48 * msPerDay);
      const carnival2 = new Date(easter.getTime() - 47 * msPerDay);
      const goodFriday = new Date(easter.getTime() - 2 * msPerDay);
      const corpusChristi = new Date(easter.getTime() + 60 * msPerDay);

      addHoliday(carnival1, 'Carnaval');
      addHoliday(carnival2, 'Carnaval');
      addHoliday(goodFriday, 'Sexta-feira Santa');
      addHoliday(easter, 'Páscoa');
      addHoliday(corpusChristi, 'Corpus Christi');

      return holidays;
    }

    let holidaysCache = {};

    function getHolidaysForYear(year) {
      if (!holidaysCache[year]) {
        holidaysCache[year] = getBrazilianHolidays(year);
      }
      return holidaysCache[year];
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Config panel toggle ──
    function toggleConfig() {
      const panel = document.getElementById('configPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    // ── Pattern builder ──
    function addPatternDay(type) {
      pattern.push(type);
      renderPattern();
    }

    function removePatternDay(index) {
      pattern.splice(index, 1);
      renderPattern();
    }

    function clearPattern() {
      pattern = [];
      renderPattern();
    }

    function renderPattern() {
      const container = document.getElementById('patternList');
      container.innerHTML = pattern.map((type, i) => {
        const label = type === 'work' ? 'Trabalho' : 'Folga';
        return `<span class="pattern-chip ${type}">
          ${label}
          <span class="remove-chip" onclick="removePatternDay(${i})">×</span>
        </span>`;
      }).join('');
    }

    // ── Apply config ──
    function applyConfig() {
      const dateInput = document.getElementById('startDate').value;
      if (!dateInput) {
        alert('Selecione a data de início do ciclo.');
        return;
      }
      if (pattern.length === 0) {
        alert('Monte o padrão da escala adicionando dias de trabalho e folga.');
        return;
      }

      // Parse date as local (not UTC) by splitting the string
      const [y, m, d] = dateInput.split('-').map(Number);
      cycleStartDate = new Date(y, m - 1, d);

      firstDayOfWeek = parseInt(document.getElementById('firstDayOfWeek').value, 10);

      saveConfig();
      renderCalendar();
      document.getElementById('configPanel').style.display = 'none';
    }

    // ── Persistence ──
    function saveConfig() {
      const config = {
        startDate: document.getElementById('startDate').value,
        pattern: pattern,
        firstDayOfWeek: parseInt(document.getElementById('firstDayOfWeek').value, 10),
        colors: {
          work: document.getElementById('colorWork').value,
          off: document.getElementById('colorOff').value,
          today: document.getElementById('colorToday').value,
          holiday: document.getElementById('colorHoliday').value
        }
      };
      localStorage.setItem('pc2-calendar-config', JSON.stringify(config));
    }

    function loadConfig() {
      const saved = localStorage.getItem('pc2-calendar-config');
      if (saved) {
        try {
          const config = JSON.parse(saved);

          if (typeof config.startDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(config.startDate)) {
            document.getElementById('startDate').value = config.startDate;
            const [y, m, d] = config.startDate.split('-').map(Number);
            cycleStartDate = new Date(y, m - 1, d);
          }

          if (Array.isArray(config.pattern) && config.pattern.length > 0 &&
              config.pattern.every(p => p === 'work' || p === 'off')) {
            pattern = config.pattern;
            renderPattern();
          }

          if (typeof config.firstDayOfWeek === 'number' && config.firstDayOfWeek >= 0 && config.firstDayOfWeek <= 6) {
            firstDayOfWeek = config.firstDayOfWeek;
            document.getElementById('firstDayOfWeek').value = config.firstDayOfWeek;
          }

          if (config.colors) {
            const root = document.documentElement;
            if (config.colors.work) {
              document.getElementById('colorWork').value = config.colors.work;
              root.style.setProperty('--work-bg', config.colors.work);
            }
            if (config.colors.off) {
              document.getElementById('colorOff').value = config.colors.off;
              root.style.setProperty('--off-bg', config.colors.off);
            }
            if (config.colors.today) {
              document.getElementById('colorToday').value = config.colors.today;
              root.style.setProperty('--today-border', config.colors.today);
            }
            if (config.colors.holiday) {
              document.getElementById('colorHoliday').value = config.colors.holiday;
              root.style.setProperty('--holiday-bg', config.colors.holiday);
            }
          }
        } catch (e) {
          console.warn('Configuração salva inválida, ignorando.', e);
        }
      }
    }

    // ── Calendar rendering ──
    function isWorkDay(date) {
      if (!cycleStartDate || pattern.length === 0) return null;

      const msPerDay = 86400000;
      const start = new Date(cycleStartDate.getFullYear(), cycleStartDate.getMonth(), cycleStartDate.getDate());
      const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      let diffDays = Math.round((target - start) / msPerDay);

      // Handle modulo for negative numbers (dates before start)
      diffDays = ((diffDays % pattern.length) + pattern.length) % pattern.length;

      return pattern[diffDays] === 'work';
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      document.getElementById('yearLabel').textContent = currentYear;

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
      const holidays = getHolidaysForYear(currentYear);
      const orderedWeekdays = getOrderedWeekdays();

      let html = '';

      for (let month = 0; month < 12; month++) {
        const firstDay = new Date(currentYear, month, 1);
        const rawWeekday = firstDay.getDay(); // 0=Sun
        const startWeekday = ((rawWeekday - firstDayOfWeek) + 7) % 7;
        const daysInMonth = new Date(currentYear, month + 1, 0).getDate();

        html += `<div class="month-card">`;
        html += `<div class="month-title">${MONTH_NAMES[month]}</div>`;
        html += `<div class="weekday-header">`;
        for (const wd of orderedWeekdays) {
          html += `<div>${wd}</div>`;
        }
        html += `</div>`;
        html += `<div class="days-grid">`;

        // Empty cells before first day
        for (let e = 0; e < startWeekday; e++) {
          html += `<div class="day-cell empty"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(currentYear, month, day);
          const work = isWorkDay(date);
          const isToday = `${currentYear}-${month}-${day}` === todayStr;
          const holidayKey = `${currentYear}-${month}-${day}`;
          const holidayName = holidays[holidayKey];

          let classes = 'day-cell';
          if (work === true) classes += ' work-day';
          else if (work === false) classes += ' off-day';
          if (isToday) classes += ' today';
          if (holidayName) classes += ' holiday-day';

          const titleAttr = holidayName ? ` title="${escapeHtml(holidayName)}"` : '';
          const holidayLabel = holidayName
            ? `<span class="holiday-label">${escapeHtml(holidayName.split(' / ')[0].length > 10 ? holidayName.split(' / ')[0].substring(0, 10) : holidayName.split(' / ')[0])}</span>`
            : '';

          html += `<div class="${classes}"${titleAttr} onclick="openDayModal(${currentYear},${month},${day})">${day}${holidayLabel}</div>`;
        }

        html += `</div></div>`;
      }

      grid.innerHTML = html;
    }

    function changeYear(delta) {
      currentYear += delta;
      renderCalendar();
    }

    // ── Day Modal ──
    function openDayModal(year, month, day) {
      const date = new Date(year, month, day);
      const work = isWorkDay(date);
      const holidays = getHolidaysForYear(year);
      const holidayKey = `${year}-${month}-${day}`;
      const holidayName = holidays[holidayKey];
      const today = new Date();
      const isToday = year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
      const weekdayName = WEEKDAY_LONG[date.getDay()];

      const dayStr = String(day).padStart(2, '0');
      const monthStr = String(month + 1).padStart(2, '0');

      let content = `<div class="modal-date">${dayStr}/${monthStr}/${year}</div>`;
      content += `<div class="modal-weekday">${weekdayName}</div>`;

      if (isToday) {
        content += `<div class="modal-info-row today-info">
          <span class="info-icon">📍</span>
          <span>Hoje</span>
        </div>`;
      }

      if (work === true) {
        content += `<div class="modal-info-row work-info">
          <span class="info-icon">💼</span>
          <span>Dia de <strong>Trabalho</strong></span>
        </div>`;
      } else if (work === false) {
        content += `<div class="modal-info-row off-info">
          <span class="info-icon">🏖️</span>
          <span>Dia de <strong>Folga</strong></span>
        </div>`;
      }

      if (holidayName) {
        const holidayNames = holidayName.split(' / ');
        for (const hn of holidayNames) {
          content += `<div class="modal-info-row holiday-info">
            <span class="info-icon">🎉</span>
            <span><strong>Feriado:</strong> ${escapeHtml(hn)}</span>
          </div>`;
        }
      }

      document.getElementById('modalContent').innerHTML = content;
      document.getElementById('dayModal').classList.add('active');
    }

    function closeDayModal(event) {
      if (event && event.target !== document.getElementById('dayModal')) return;
      document.getElementById('dayModal').classList.remove('active');
    }

    // Close modal on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.getElementById('dayModal').classList.remove('active');
      }
    });

    // ── Init ──
    renderColorPresets();
    loadConfig();
    document.getElementById('yearLabel').textContent = currentYear;

    if (cycleStartDate && pattern.length > 0) {
      document.getElementById('configPanel').style.display = 'none';
      renderCalendar();
    } else {
      renderCalendar();
    }
  </script>
</body>
</html>
